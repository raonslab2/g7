repair_contracts:
  registration: native product identity; unpublished default; optional itinerary defaults []; duplicate409; unknown price/product_id tamper422
  candidates: excludes mapped native products; options carry original IDs; bounded48; permissioned manager only
  business_day: Asia/Seoul same-day excluded across discovery/detail/cart/submit
  keyword: decoded native ko/en JSON translations, Korean search and literal wildcard behavior
  unavailable_dates: future full/understock detail choices available0; discovery still needs one available date
