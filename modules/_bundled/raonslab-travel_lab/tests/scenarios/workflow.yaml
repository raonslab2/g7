sub_flows:
  - id: eligibility_matrix
    description: 비공개 여행, 비활성 출발일/옵션, 과거 출발일, 잘못된 귀국일, 판매중지 상품, 옵션 상품 불일치 7개 실제 입력.
    effects: [unavailable_departure_rejected, unavailable_submit_rolled_back]
  - id: status_matrix
    description: 상태 5개와 목표 상태 5개의 전 조합 25개를 허용 전이표와 대조한다.
    effects: [transition_matrix_enforced, capacity_released_once, invalid_transition_rolled_back]
limitations:
  - SQLite는 SELECT FOR UPDATE를 지원하지 않는다. 이 스위트는 순차 경계·롤백·재시도를 검증하며 MySQL 병렬 락 검증 또는 독립 Validation PASS를 주장하지 않는다.
  - 실제 도메인 모델·enum·provider·여행 migration을 사용한다. DomainContract fixture 및 스키마 fallback은 제거했다.
  - 코어/커머스 의존 migration의 SQLite 실행 제한은 canonical ModuleTestCase에 기록한다. 네이티브 게시판 테스트는 별도 MySQL 테스트 환경에서 실행한다.
