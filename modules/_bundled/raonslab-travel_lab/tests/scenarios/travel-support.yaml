# 매니페스트 양식: docs/testing-guide.md "매니페스트 양식" — 테스트 메서드 docblock 의 @scenario case=<sub_flow id> 로 매핑한다.
feature: travel_lab_support
description: 여행 연구소 고객지원 — G7 게시판 재사용 공지/FAQ 공개 열람, 1:1 비밀 문의 작성자·관리자 격리, 알림 억제, LAB 게이트 프로비저닝, 관리자 레이아웃 계약
test_files:
- modules/_bundled/raonslab-travel_lab/tests/Feature/TravelSupportProvisionerTest.php
- modules/_bundled/raonslab-travel_lab/tests/Feature/TravelSupportApiTest.php
- modules/_bundled/raonslab-travel_lab/tests/Feature/TravelSupportNotificationTest.php
- modules/_bundled/raonslab-travel_lab/tests/Feature/TravelSupportAdminLayoutRulesTest.php
- modules/_bundled/raonslab-travel_lab/tests/Feature/W03SupportHardeningTest.php
- modules/_bundled/raonslab-travel_lab/resources/js/__tests__/layouts/admin-travel-lab-layouts.test.tsx
