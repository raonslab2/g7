  - support_update_self_or_role_scope
  - board_write_self_or_role_scope
  channel:
  - notices
  - faqs
  - questions
  board_state:
  - missing
  - provisioned_safe
  - existing_unsafe_same_slug
  - tampered_permissions_or_settings
  - all_16_missing_empty_or_foreign_permission_grants
  - external_search_driver
  provision_gate:
  - config_off_confirm_off
  - config_on_confirm_off
  - config_off_confirm_on
  - config_loose_truthy
  - config_on_confirm_on
  operation:
  - list
  - show
  - create
  - update
  - provision
  - provision_rerun
  - native_admin_answer
exclusions:
- actor: guest
  channel: questions
  operation: show
  reason: 문의 채널은 인증 필수 — 401 단일 결과로 auth_required 케이스가 커버
- board_state: existing_unsafe_same_slug
  operation: create
  reason: 불일치 게시판에서는 요청 경로가 not_ready(503)로 수렴 — request_path_fail_closed 와 동일 경로
