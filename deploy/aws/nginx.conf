worker_processes 1;
pid /run/g7-product-web/nginx.pid;
error_log /srv/g7/current/storage/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format g7 '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" request_time=$request_time';
    access_log /srv/g7/current/storage/logs/nginx-access.log g7;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    client_body_temp_path /run/g7-product-web/client_temp;
    proxy_temp_path /run/g7-product-web/proxy_temp;
    fastcgi_temp_path /run/g7-product-web/fastcgi_temp;

    server {
        listen 127.0.0.1:18770;
        server_name 127.0.0.1 localhost;
        root /srv/g7/current/public;
        index index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /install {
            rewrite ^ /index.php last;
        }

        location ^~ /install/ {
            rewrite ^ /index.php last;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(?:/|$) {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass unix:/run/g7-product-fpm/php-fpm.sock;
            fastcgi_read_timeout 900s;
            fastcgi_buffering off;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
