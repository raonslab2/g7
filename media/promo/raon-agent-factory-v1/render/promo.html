<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RAON Agent Factory Promo V1 — compositor</title>
<!--
  결정적(deterministic) 영상 합성기. window.__render(t) 가 시각 t(초)의 한 프레임을 그린다.
  ?o=h (1920x1080, 기본) | ?o=v (1080x1920). 렌더는 render.mjs 가 프레임 단위로 캡처한다.
  실제 제품 화면은 assets/ 의 캡처 이미지를 그대로 쓰며, 위에 강조 박스·라벨만 겹친다.
-->
<style>
@font-face { font-family: "Pretendard"; font-weight: 100 900; src: url("/templates/_bundled/sirsoft-basic/dist/vendor/pretendard/1.3.9/woff2/PretendardVariable.woff2") format("woff2"); }
:root {
  --bg: #0a0e13; --graphite: #131a22; --navy: #0f1b2d; --slate: #c9d2dd; --muted: #8a97a8; --dim: #5d6876;
  --blue: #7fa6d6; --green: #74c19e; --line: rgba(160, 180, 205, 0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
body { font-family: "Pretendard", "Noto Sans CJK KR", sans-serif; color: var(--slate); -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 70% 10%, #13213a 0%, #0c131d 45%, #080b10 100%); }
.layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.abs { position: absolute; }
.kicker { font-size: 20px; letter-spacing: 0.22em; font-weight: 600; color: var(--blue); text-transform: uppercase; }
.kicker::before { content: ""; display: inline-block; width: 36px; height: 1px; background: var(--blue); vertical-align: middle; margin-right: 14px; opacity: .7; }
.headline { font-weight: 700; color: #eef2f7; letter-spacing: -0.02em; line-height: 1.18; }
.body { color: var(--muted); line-height: 1.55; }
.tag { position: absolute; font-size: 15px; font-weight: 600; color: #aeb9c6; background: rgba(15, 22, 32, .78); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; letter-spacing: .01em; white-space: nowrap; }
.tag b { color: var(--green); font-weight: 700; margin-right: 6px; }
.phone { position: absolute; border-radius: 44px; background: #0d1218; border: 2px solid #2a3442; box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 0 0 7px #05080c; padding: 9px; }
.phone .vp { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 34px; background: #0b1220; }
.phone .vp img, .browser .vp img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
.browser { position: absolute; border-radius: 14px; background: #0e141c; border: 1px solid #263140; box-shadow: 0 40px 100px rgba(0,0,0,.55); overflow: hidden; }
.browser .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #121a24; border-bottom: 1px solid #1f2935; }
.browser .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2c3746; display: block; }
.browser .bar span { margin-left: 14px; font-size: 13px; color: #6f7c8c; background: #0b1118; border-radius: 6px; padding: 4px 14px; min-width: 240px; }
.browser .vp { position: relative; overflow: hidden; }
.hl { position: absolute; border: 2px solid rgba(116, 193, 158, .95); border-radius: 12px; background: rgba(116, 193, 158, .08); box-shadow: 0 0 0 6px rgba(116, 193, 158, .10); opacity: 0; }
.hl.blue { border-color: rgba(127, 166, 214, .95); background: rgba(127, 166, 214, .08); box-shadow: 0 0 0 6px rgba(127, 166, 214, .10); }
.callout { position: absolute; font-size: 21px; font-weight: 700; color: #e9eef5; background: rgba(13, 20, 30, .92); border: 1px solid rgba(116,193,158,.55); border-radius: 10px; padding: 9px 14px; white-space: nowrap; opacity: 0; }
.callout small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.callout.blue { border-color: rgba(127,166,214,.6); }
.node { position: absolute; border-radius: 16px; background: rgba(17, 25, 37, .92); border: 1px solid #2a3647; padding: 18px 22px; text-align: left; }
.node h4 { font-size: 28px; color: #eef2f7; font-weight: 700; letter-spacing: -0.01em; }
.node p { font-size: 17px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.node.accent { border-color: rgba(127,166,214,.6); }
.node.green { border-color: rgba(116,193,158,.6); }
.step { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 700; color: #4f5b69; margin: 18px 0; }
.step i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; display: block; flex: none; }
.step span small { display: block; font-size: 17px; font-weight: 500; color: inherit; opacity: .85; margin-top: 3px; }
.frag { position: absolute; border-radius: 10px; background: rgba(22, 31, 44, .85); border: 1px solid #253042; padding: 10px 12px; font-size: 15px; color: #7f8b99; font-family: ui-monospace, "Noto Sans Mono CJK KR", monospace; white-space: nowrap; }
.frag .bar { height: 7px; border-radius: 4px; background: #253144; margin-top: 7px; }
.wordmark { text-align: center; }
.wordmark .r { font-size: 132px; font-weight: 800; letter-spacing: 0.04em; color: #f1f4f8; line-height: 1; }
.wordmark .f { font-size: 26px; font-weight: 600; letter-spacing: 0.62em; color: var(--blue); margin-top: 18px; padding-left: .62em; }
.lane { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, rgba(127,166,214,.22), transparent); }
.dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(116,193,158,.35); }
.dot.b { background: var(--blue); box-shadow: 0 0 12px rgba(127,166,214,.35); }
.cap { position: absolute; font-size: 22px; font-weight: 600; color: var(--slate); text-align: center; }
.endline { font-size: 64px; font-weight: 700; color: #eef2f7; letter-spacing: -0.02em; margin: 10px 0; opacity: 0; }
.endline em { font-style: normal; color: var(--green); }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 100% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const V = Q.get("o") === "v";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
const A = (p) => "../assets/" + p;
// 캡처 시 기록한 실제 DOM 좌표(css px). 강조 박스는 이 값만 사용한다.
const MAN = (() => { const x = new XMLHttpRequest(); x.open("GET", "../capture/ai-gcs-capture-manifest.json", false); x.send(); return JSON.parse(x.responseText); })();
const RC = (file, sel, i = 0) => { const r = MAN.find((m) => m.file === file)?.rects_css_px?.[sel]?.[i]; if (!r) throw new Error(`rect missing ${file} ${sel} ${i}`); return r; };

// ── helpers ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, x) => a + (b - a) * x;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = .5) => Math.min(eout(ramp(t, a, a + f)), 1 - ease(ramp(t, b - f, b)));
const L = (h, v) => (V ? v : h);
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; (parent || stage).append(e); return e; }
function put(e, x, y, w, h) { e.style.left = x + "px"; e.style.top = y + "px"; if (w !== undefined) e.style.width = w + "px"; if (h !== undefined) e.style.height = h + "px"; return e; }
function layer() { return el("div", "layer"); }
function rnd(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function text(parent, cls, html, x, y, w, size) { const e = el("div", "abs " + cls, parent, html); put(e, x, y, w); if (size) e.style.fontSize = size + "px"; return e; }
function tag(parent, html, x, y) { if (V) { x = 80; y = 84; } const e = el("div", "tag", parent, html); put(e, x, y); return e; }

/** 실제 모바일 캡처를 휴대폰 프레임에. cssW=390 기준 좌표계. */
function phone(parent, src, x, y, w, cssH = 844) {
  const h = w * cssH / 390 + 18;
  const p = put(el("div", "phone", parent), x, y, w + 18, h);
  const vp = el("div", "vp", p);
  const img = el("img", "", vp); img.src = src;
  const s = w / 390;
  return { root: p, img, vp, s, scroll(px) { img.style.transform = `translateY(${-px * s}px)`; this.sy = px; }, sy: 0 };
}
/** 실제 데스크톱 캡처를 브라우저 프레임에. cssW=1440 기준 좌표계. */
function browser(parent, src, x, y, w, label, cssH = 900, cx = 0, cw = 1440) {
  const vh = w * cssH / cw;
  const b = put(el("div", "browser", parent), x, y, w, vh + 34);
  const bar = el("div", "bar", b, "<i></i><i></i><i></i><span>" + label + "</span>");
  const vp = put(el("div", "vp", b), 0, 0, w, vh); vp.style.position = "relative";
  const img = el("img", "", vp); img.src = src;
  const s = w / cw;
  img.style.width = 1440 * s + "px"; img.style.left = -cx * s + "px";
  return { root: b, img, vp, s, cx, scroll(px) { img.style.transform = `translateY(${-px * s}px)`; this.sy = px; }, sy: 0 };
}
/** 캡처 시 기록한 실제 DOM 좌표(css px)에 강조 박스. */
function hl(dev, rect, cls = "", pad = 4) {
  const e = el("div", "hl " + cls, dev.vp);
  const [x0, y, w, h] = rect; const x = x0 - (dev.cx || 0);
  put(e, x * dev.s - pad, y * dev.s - pad, w * dev.s + pad * 2, h * dev.s + pad * 2);
  return e;
}

const scenes = [];
function scene(a, b, build, draw, fade = .6) { const root = layer(); const ctx = build(root); scenes.push({ a, b, root, ctx, draw, fade }); }

// ───────────────── S1 문제 제시 (0–7) · 추상 모션 ─────────────────
scene(0, 7.2, (root) => {
  const r = rnd(7), frags = [];
  const labels = ["답변 완료", "patch.diff", "다시 시도할까요?", "TODO: 확인 필요", "✓ done?", "어디에 반영됐지?", "로그 확인 중…", "브랜치가 뭐였지?", "테스트는?", "배포됐나요?", "답변 완료", "copy & paste", "결과 요약", "누가 검토했나요?"];
  for (let i = 0; i < 26; i++) {
    const f = el("div", "frag", root, labels[i % labels.length] + '<div class="bar" style="width:' + (60 + r() * 120) + 'px"></div>');
    frags.push({ e: f, x: r() * W * 1.05 - 40, y: r() * H * .9, vx: (r() - .5) * 26, vy: (r() - .5) * 18, d: r() * 1.4, z: .55 + r() * .7 });
  }
  const h1 = text(root, "headline", "AI는 빠르게 답합니다.", L(160, 80), L(430, 760), L(1600, 920), L(84, 72));
  const h2 = text(root, "headline", "그 일이, 정말<br>끝났을까요?", L(160, 80), L(380, 700), L(1600, 920), L(96, 84));
  return { frags, h1, h2 };
}, (t, c) => {
  for (const f of c.frags) {
    const o = win(t, .2 + f.d, 6.7, .8) * .55 * f.z * (1 - .55 * ramp(t, 3.2, 4.2));
    f.e.style.opacity = o;
    f.e.style.transform = `translate(${f.x + f.vx * t}px, ${f.y + f.vy * t}px) scale(${f.z})`;
    f.e.style.filter = `blur(${(1.3 - f.z) * 3 + ramp(t, 3.4, 4.4) * 2}px)`;
  }
  c.h1.style.opacity = win(t, .5, 3.6, .6); c.h1.style.transform = `translateY(${(1 - eout(ramp(t, .5, 1.3))) * 30}px)`;
  c.h2.style.opacity = win(t, 3.7, 7.0, .6); c.h2.style.transform = `translateY(${(1 - eout(ramp(t, 3.7, 4.5))) * 30}px)`;
});

// ───────────────── S2 RAON Agent Factory 소개 (7–16) · 추상 모션 ─────────────────
scene(7, 16.3, (root) => {
  const lanes = [], dots = [];
  const r = rnd(11);
  const n = V ? 14 : 9;
  for (let i = 0; i < n; i++) {
    const y = (i + .5) * H / n;
    lanes.push(put(el("div", "lane", root), 0, y, W));
    for (let k = 0; k < 3; k++) dots.push({ e: put(el("div", "dot" + (r() > .5 ? " b" : ""), root), 0, y - 5), sp: 90 + r() * 140, off: r() * W, dir: i % 2 ? -1 : 1 });
  }
  const wm = el("div", "abs wordmark", root, '<div class="r">RAON</div><div class="f">AGENT FACTORY</div>');
  put(wm, 0, L(250, 560), W);
  const l1 = text(root, "headline", "AI Agent를 만드는 공장.", 0, L(640, 1000), W, L(64, 62));
  const l2 = text(root, "headline", "실제로 일하게 만드는 <span style='color:var(--green)'>운영 플랫폼.</span>", 0, L(730, 1100), W, L(64, 58));
  const en = text(root, "body", "Builds AI agents — and puts them to work.", 0, L(830, 1210), W, 24);
  for (const e of [l1, l2, en]) e.style.textAlign = "center";
  return { lanes, dots, wm, l1, l2, en };
}, (t, c) => {
  const lt = t - 7;
  c.lanes.forEach((l, i) => { l.style.opacity = .9 * eout(ramp(lt, i * .06, i * .06 + 1)); });
  for (const d of c.dots) { let x = (d.off + d.dir * d.sp * lt) % (W + 40); if (x < 0) x += W + 40; d.e.style.transform = `translateX(${x - 20}px)`; d.e.style.opacity = .85 * eout(ramp(lt, .6, 1.6)) * (1 - .55 * ramp(lt, 2.2, 3.2)); }
  c.wm.style.opacity = eout(ramp(lt, 1.2, 2.4)); c.wm.style.transform = `scale(${lerp(1.04, 1, eout(ramp(lt, 1.2, 3)))})`;
  c.l1.style.opacity = eout(ramp(lt, 3.6, 4.4)); c.l1.style.transform = `translateY(${(1 - eout(ramp(lt, 3.6, 4.4))) * 24}px)`;
  c.l2.style.opacity = eout(ramp(lt, 5.0, 5.8)); c.l2.style.transform = `translateY(${(1 - eout(ramp(lt, 5.0, 5.8))) * 24}px)`;
  c.en.style.opacity = .8 * eout(ramp(lt, 6.0, 6.8));
});

// ───────────────── S3a AI_GCS 내 작업 (16–22) · 실제 UI ─────────────────
scene(16, 22, (root) => {
  const k = text(root, "kicker", "01 · 대화로 지시", L(1290, 80), L(330, 150));
  const h = text(root, "headline", L("대화하듯,<br>한 문장으로.", "대화하듯, 한 문장으로."), L(1290, 80), L(380, 200), L(560, 920), L(66, 64));
  const b = text(root, "body", "AI_GCS V2 — 모바일 우선 작업 지시 Web.<br>내 작업 · 지시함 · 프로젝트 · 운영 통계", L(1290, 80), L(560, 300), L(560, 920), L(24, 28));
  const dev = V ? phone(root, A("ui/01-work-list-390x844.webp"), 240, 520, 600) : browser(root, A("ui/01-work-list-1440x900.webp"), 110, 200, 1110, "AI_GCS V2");
  const tg = tag(root, "<b>실제 화면</b>AI_GCS V2 · 데모 데이터", L(110, 60), L(150, 500));
  // 상단 내비 탭(내 작업 · 지시함 · 프로젝트 · 운영 통계). 이 한 곳만 화면 실측(2160px 캡처 → css) 근사값.
  const nav = V ? hl(dev, RC("01-work-list-390x844.png", "button.primary, .submit-request"), "blue") : hl(dev, [490, 11, 450, 44], "blue", 2);
  return { k, h, b, dev, tg, nav };
}, (t, c) => {
  const lt = t - 16;
  c.dev.root.style.transform = `translateY(${(1 - eout(ramp(lt, 0, 1))) * 40}px) scale(${lerp(1, 1.03, ramp(lt, 0, 6))})`;
  c.dev.root.style.transformOrigin = "30% 30%";
  c.k.style.opacity = eout(ramp(lt, .3, 1)); c.h.style.opacity = eout(ramp(lt, .5, 1.3)); c.b.style.opacity = eout(ramp(lt, 1.0, 1.8));
  c.tg.style.opacity = eout(ramp(lt, .6, 1.2));
  c.nav.style.opacity = win(lt, 2.4, 5.6, .4);
});

// ───────────────── S3b 한 문장 작업 지시 (21.5–28) · 실제 UI ─────────────────
scene(21.5, 28, (root) => {
  const pw = L(420, 600);
  const dev = phone(root, A("ui/02-composer-390x844.webp"), L(1200, 230), L(70, 520), pw);
  const k = text(root, "kicker", "AI_GCS · 새 요청", L(170, 80), L(300, 150));
  const h = text(root, "headline", "무엇을 맡길까요?", L(170, 80), L(350, 200), L(900, 920), L(70, 66));
  const b = text(root, "body", "프로젝트와 Provider를 고르고 원문 그대로 보냅니다.<br>의미를 분류하거나 다시 쓰지 않습니다.", L(170, 80), L(470, 300), L(900, 920), L(28, 28));
  const tg = tag(root, "<b>실제 화면</b>AI_GCS V2 · 모바일 390px · 데모 데이터", L(170, 80), L(250, 440));
  const hp = hl(dev, RC("02-composer-390x844.png", "#project-id"), "blue"), hv = hl(dev, RC("02-composer-390x844.png", "#provider-profile"), "blue"), hr = hl(dev, RC("02-composer-390x844.png", "#request-prompt"));
  const c1 = el("div", "callout blue", root, "프로젝트"), c2 = el("div", "callout blue", root, "Provider · CODEX / CLAUDE"), c3 = el("div", "callout", root, "한 문장 지시<small>원문 그대로 Provider에 전달</small>");
  const px = L(1200, 230) + 9, py = L(70, 520) + 9, s = dev.s;
  if (V) for (const c of [c1, c2, c3]) c.style.display = "none";
  else { for (const [c, y] of [[c1, 245], [c2, 350], [c3, 520]]) { put(c, px - 36, py + y * s); c.style.transform = "translateX(-100%)"; } }
  return { dev, k, h, b, tg, hp, hv, hr, c1, c2, c3 };
}, (t, c) => {
  const lt = t - 21.5;
  c.dev.root.style.transform = `translateY(${(1 - eout(ramp(lt, 0, 1))) * 60}px)`;
  c.k.style.opacity = eout(ramp(lt, .2, .9)); c.h.style.opacity = eout(ramp(lt, .4, 1.2)); c.b.style.opacity = eout(ramp(lt, .9, 1.7)); c.tg.style.opacity = eout(ramp(lt, .5, 1.1));
  c.hp.style.opacity = c.c1.style.opacity = win(lt, 1.4, 6.5, .4);
  c.hv.style.opacity = c.c2.style.opacity = win(lt, 2.2, 6.5, .4);
  c.hr.style.opacity = c.c3.style.opacity = win(lt, 3.2, 6.5, .4);
});

// ───────────────── S3c 내 작업 · 지시함 · 프로젝트 (27.5–33) · 실제 UI ─────────────────
scene(27.5, 33.2, (root) => {
  const items = [["ui/01-work-list-390x844.webp", "내 작업", "상태별 진행 · 실행 중 카드"], ["ui/03-work-orders-390x844.webp", "지시함", "Git 작업지시서 수집 · 작업등록"], ["ui/08-project-hub-390x844.webp", "프로젝트", "프로젝트별 진행 · 최근 활동"]];
  const pw = L(350, 300), gap = L(110, 40), x0 = (W - (pw * 3 + gap * 2 + 54)) / 2, y0 = L(150, 640);
  const devs = items.map(([src, name, sub], i) => {
    const d = phone(root, A(src), x0 + i * (pw + 18 + gap), y0, pw);
    const cap = text(root, "cap", name + "<br><span style='font-size:17px;color:var(--muted);font-weight:500'>" + sub + "</span>", x0 + i * (pw + 18 + gap), y0 + pw * 844 / 390 + L(34, 40), pw + 18);
    if (!V) cap.style.display = "none";
    return { d, cap };
  });
