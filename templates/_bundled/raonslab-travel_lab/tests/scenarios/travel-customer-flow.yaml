feature: RAON Travel Lab 고객 여행 화면 (탐색 → 출발일·인원 → 여행 장바구니 → 상담 요청(테스트) → 진행 상태 · 고객센터)

description: |
  raonslab-travel_lab 사용자 템플릿이 같은 이름의 모듈 공개 API(/api/modules/raonslab-travel_lab)를
  화면에 연결한다. 여행 식별자는 이커머스 상품 id, 출발편은 이커머스 ProductOption, 인원은 Cart.quantity.
  상담 요청과 그 상태(TEST_INQUIRY → UNDER_REVIEW → TEST_ACCEPTED / DECLINED / CANCELLED)는 모두
  거래 테스트(시뮬레이션)이며 실제 예약·결제·환불은 일어나지 않는다.

  핵심 동작:
    - 모든 흐름(홈·검색·상세·장바구니·요청 목록/상세·고객센터)이 로딩 / 빈 / 오류+다시 시도 상태를 가진다
    - 검색 조건은 주소(query)가 단일 출처 — 정렬·페이지 이동은 조건을 승계, 초기화는 승계하지 않는다
    - 장바구니 담기·인원 변경·요청 제출은 가격을 보내지 않는다 (서버가 출발편 기준으로 계산)
    - 멱등 키: 장바구니 로드 시 (항목 id × 인원) 묶음 지문으로 확보, 네트워크 오류 재시도는 같은 키, 성공 시에만 폐기
    - 장바구니·요청은 로그인 필요(Sanctum bearer, auth_mode=required) — 비회원은 상세에서 로그인 후 복귀
    - 2단계 인증이 켜진 사이트의 로그인 200(two_factor_required) 응답을 인증번호 단계로 처리

axes:
  viewer: [guest, member]
  viewport: [mobile_390, desktop_1440]
  data_source_state: [loading, loaded_with_items, loaded_empty, error_retryable, not_found_404]
  search_filters: [none, keyword, region, theme, date_range, price_range, combined]
  sort: [recommended, price_asc, price_desc, departure_asc]
  pagination_meta: [single_page, multi_page_exact_total, capped_total_last_page_null]
  departure_state: [available, sold_out, none_scheduled]
  people_change: [increase_within_seats, increase_at_limit_blocked, decrease_to_one_blocked]
  inquiry_submit_outcome: [success, validation_422, conflict_409, network_error_then_retry]
  inquiry_status: [TEST_INQUIRY, UNDER_REVIEW, TEST_ACCEPTED, DECLINED, CANCELLED]
  help_tab: [notices, faq, questions]
  login_response: [authenticated, two_factor_required]
  locale: [ko, en]

exclusions:
  - { viewer: guest, inquiry_submit_outcome: success, reason: "장바구니·요청 라우트는 auth_required — 비회원은 도달 전 로그인으로 이동" }
  - { viewer: guest, inquiry_status: TEST_INQUIRY, reason: "요청 상세는 auth_required" }
  - { departure_state: none_scheduled, people_change: increase_within_seats, reason: "출발일 미선택 시 인원 조작은 상한 1" }

