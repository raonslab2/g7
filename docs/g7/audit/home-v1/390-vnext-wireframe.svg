<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2720" viewBox="0 0 390 2720" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="12">
  <title>RAON Agent Factory Home vNext — 390px 구조 와이어프레임 (구현 화면 아님)</title>
  <style>
    .bg{fill:#f4f5f7}.box{fill:#fff;stroke:#9aa3ad;stroke-width:1}.ph{fill:#e3e7ec;stroke:#9aa3ad;stroke-dasharray:4 3}
    .h{font-size:17px;font-weight:700;fill:#1f2933}.t{fill:#52606d}.s{font-size:10px;fill:#7b8794}
    .sec{font-size:10px;font-weight:700;fill:#c2410c;letter-spacing:1px}.btn{fill:#1f2933}.btnt{fill:#fff;font-weight:700}
    .ok{fill:#2f855a}.nv{fill:none;stroke:#b7791f;stroke-dasharray:3 2}.fold{stroke:#c2410c;stroke-dasharray:6 4}
  </style>
  <rect class="bg" width="390" height="2720"/>

  <!-- 1 헤더: 한 줄 -->
  <rect class="box" x="0" y="0" width="390" height="52"/>
  <text x="16" y="31" font-weight="700">RAON Agent Factory</text>
  <rect class="btn" x="236" y="12" width="96" height="28" rx="6"/><text class="btnt" x="254" y="31">구축 상담</text>
  <text x="352" y="32" font-size="18">≡</text>
  <text class="s" x="16" y="66">① 헤더 1줄: 정보·정책·커뮤니티는 ≡ 드로어로 모음</text>

  <!-- 2 히어로 (B: 실제 제품 화면) -->
  <text class="sec" x="16" y="96">② WHAT</text>
  <text class="h" x="16" y="122">[카피 초안] 업무 시스템에 연결해 실행하고</text>
  <text class="h" x="16" y="146">검증까지 끝내는 AI 에이전트</text>
  <text class="t" x="16" y="172">한 업무부터 구축·검증·운영까지 맡습니다.</text>
  <rect class="btn" x="16" y="188" width="358" height="44" rx="8"/><text class="btnt" x="136" y="215">AI 에이전트 구축 상담</text>
  <text x="130" y="256" fill="#1f2933" text-decoration="underline">자체 제품 사례 보기 ↓</text>
  <rect class="ph" x="16" y="272" width="358" height="250" rx="10"/>
  <text class="t" x="40" y="300">[B] 실제 제품 화면 — 비식별 처리한 캡처</text>
  <rect class="box" x="36" y="316" width="318" height="30" rx="4"/><text class="s" x="46" y="335">요청: “○○ 업무 자동화 요청” (예시 문구·가명)</text>
  <rect class="box" x="36" y="354" width="318" height="96" rx="4"/>
  <text class="s" x="46" y="374">진행: 접수 → 실행 → 검증</text>
  <circle class="ok" cx="52" cy="396" r="6"/><text class="s" x="64" y="400">통과</text>
  <circle cx="112" cy="396" r="6" class="nv"/><text class="s" x="124" y="400">미검증</text>
  <text class="s" x="46" y="428">결과·후속 지시가 같은 요청 기록에 남음</text>
  <text class="s" x="36" y="476">캡션: 자체 제품 RAON Hub AI 작업공간 화면 (가공)</text>
  <text class="s" x="36" y="494">※ 캡처 확보 전에는 현 파이프라인 도식(A)을 축소해 대체</text>
  <line class="fold" x1="0" y1="844" x2="390" y2="844"/><text class="s" x="300" y="838">첫 화면 끝(844)</text>

  <!-- 3 증거 스트립 -->
  <text class="sec" x="16" y="560">③ PROOF (첫 스크롤 안)</text>
  <rect class="box" x="16" y="572" width="173" height="64" rx="8"/><text x="28" y="598" font-weight="700">MOBILE_STOCK</text><text class="s" x="28" y="618">자체 제품 · 모의투자</text>
  <rect class="box" x="201" y="572" width="173" height="64" rx="8"/><text x="213" y="598" font-weight="700">RAON Hub</text><text class="s" x="213" y="618">자체 제품 · G7 확장</text>
  <text class="s" x="16" y="654">“고객 납품 아님 · 자체 제품” 배지 1회만 표기</text>

  <!-- 4 차별점: 비교 -->
  <text class="sec" x="16" y="700">④ PROBLEM → 차이</text>
  <text class="h" x="16" y="726">대화형 AI와 무엇이 다른가</text>
  <rect class="box" x="16" y="742" width="173" height="150" rx="8"/><text x="28" y="766" font-weight="700">대화형 AI</text>
  <text class="t" x="28" y="792">답변 제안</text><text class="t" x="28" y="816">사람이 옮겨 적음</text><text class="t" x="28" y="840">확인 기준 없음</text><text class="t" x="28" y="864">기록 없음</text>
  <rect class="box" x="201" y="742" width="173" height="150" rx="8" stroke="#1f2933" stroke-width="2"/><text x="213" y="766" font-weight="700">RAON 에이전트</text>
  <text class="t" x="213" y="792">시스템·권한 안 실행</text><text class="t" x="213" y="816">결과를 시스템에 반영</text><text class="t" x="213" y="840">통과·실패·미검증</text><text class="t" x="213" y="864">요청 기록 보존</text>

  <!-- 5 서비스 -->
  <text class="sec" x="16" y="940">⑤ SERVICES</text>
  <text class="h" x="16" y="966">업무 하나에서 시작합니다</text>
  <rect class="box" x="16" y="982" width="358" height="58" rx="8"/><text x="28" y="1006" font-weight="700">01 업무 한 개 실증</text><text class="s" x="28" y="1026">대상·성공 기준·권한 경계 → 결과 보고</text>
  <rect class="box" x="16" y="1048" width="358" height="58" rx="8"/><text x="28" y="1072" font-weight="700">02 맞춤 에이전트 구축</text><text class="s" x="28" y="1092">기존 시스템 연동 · 요청/결과 화면</text>
  <rect class="box" x="16" y="1114" width="358" height="58" rx="8"/><text x="28" y="1138" font-weight="700">03 운영·개선</text><text class="s" x="28" y="1158">실행 기록 기반 개선 · 재검증</text>
  <text class="s" x="16" y="1190">체크리스트 9줄 → 1줄 요약, 상세는 /page/service</text>

  <!-- 6 사례 -->
  <text class="sec" x="16" y="1236">⑥ CASES</text>
  <text class="h" x="16" y="1262">직접 만들고 검증한 자체 제품</text>
  <rect class="box" x="16" y="1278" width="358" height="250" rx="10"/>
  <rect class="ph" x="28" y="1290" width="334" height="120" rx="6"/><text class="t" x="96" y="1354">[실제 화면 썸네일 — 비식별]</text>
  <text x="28" y="1434" font-weight="700">MOBILE_STOCK — 모의투자</text>
  <text class="s" x="28" y="1456">문제 1줄 · 구축 1줄</text>
  <circle class="ok" cx="34" cy="1480" r="5"/><text class="s" x="46" y="1484">검증: 요청별 구현·검증 기록</text>
  <circle cx="34" cy="1504" r="5" class="nv"/><text class="s" x="46" y="1508">미검증: 실거래·투자 성과·외부 고객 운영</text>
  <rect class="box" x="16" y="1540" width="358" height="250" rx="10"/>
  <rect class="ph" x="28" y="1552" width="334" height="120" rx="6"/><text class="t" x="96" y="1616">[실제 화면 썸네일 — 비식별]</text>
  <text x="28" y="1696" font-weight="700">RAON Hub — G7 확장 제품화</text>
  <text class="s" x="28" y="1718">문제 1줄 · 구축 1줄 · 코어 수정 0건</text>
  <circle class="ok" cx="34" cy="1742" r="5"/><text class="s" x="46" y="1746">검증: 기능·AI 연동·모바일 화면 점검 통과</text>
  <circle cx="34" cy="1766" r="5" class="nv"/><text class="s" x="46" y="1770">미검증: 상용 부하·장기 운영·외부 고객</text>
  <text class="s" x="16" y="1808">J1~J10·A1~A10 코드와 모듈 ID는 /page/cases 로 이동</text>

  <!-- 7 절차 + 신뢰 -->
  <text class="sec" x="16" y="1852">⑦ PROCESS + TRUST</text>
  <text class="h" x="16" y="1878">작게 확인하고, 확인된 만큼 넓힙니다</text>
  <g font-size="11" font-weight="700" fill="#1f2933">
    <circle cx="44" cy="1918" r="16" class="box"/><text x="40" y="1922">1</text>
    <circle cx="114" cy="1918" r="16" class="box"/><text x="110" y="1922">2</text>
    <circle cx="184" cy="1918" r="16" class="box"/><text x="180" y="1922">3</text>
    <circle cx="254" cy="1918" r="16" class="box"/><text x="250" y="1922">4</text>
    <circle cx="324" cy="1918" r="16" class="box"/><text x="320" y="1922">5</text>
  </g>
  <line x1="60" y1="1918" x2="98" y2="1918" stroke="#9aa3ad"/><line x1="130" y1="1918" x2="168" y2="1918" stroke="#9aa3ad"/><line x1="200" y1="1918" x2="238" y2="1918" stroke="#9aa3ad"/><line x1="270" y1="1918" x2="308" y2="1918" stroke="#9aa3ad"/>
  <g class="s"><text x="28" y="1950">상담</text><text x="98" y="1950">범위·권한</text><text x="172" y="1950">실증</text><text x="238" y="1950">검증 공유</text><text x="306" y="1950">운영</text></g>
  <rect class="box" x="16" y="1970" width="358" height="92" rx="8"/>
  <text x="28" y="1994" font-weight="700">원칙 3가지</text>
  <text class="t" x="28" y="2018">· 권한 안에서만 실행</text><text class="t" x="28" y="2038">· 통과·실패·미검증 그대로 보고</text><text class="t" x="200" y="2018">· 코어 수정 최소화</text>
  <text class="s" x="16" y="2080">원칙 5개 카드 → 3줄, 상세는 /page/technology</text>

  <!-- 8 CTA -->
  <text class="sec" x="16" y="2124">⑧ CTA</text>
  <rect x="16" y="2136" width="358" height="210" rx="12" fill="#1f2933"/>
  <text x="32" y="2168" fill="#fff" font-size="16" font-weight="700">어떤 업무부터 시작할지 정리합니다</text>
  <text x="32" y="2194" fill="#cbd2d9">준비하면 좋은 것: 반복 업무 · 연결할 시스템 · 결과 기준</text>
  <rect x="32" y="2214" width="326" height="44" rx="8" fill="#fff"/><text x="120" y="2241" font-weight="700" fill="#1f2933">[접수 상태 1줄 + 가능한 채널]</text>
  <text x="32" y="2284" fill="#cbd2d9" font-size="10">접수 닫힘이면 사실 1줄만, 승인된 채널이 생기면 이 자리에 노출.</text>
  <text x="32" y="2302" fill="#cbd2d9" font-size="10">회원가입·AI 작업공간 권한 안내는 FAQ로 이동</text>

  <!-- 푸터 -->
  <rect class="box" x="0" y="2380" width="390" height="340"/>
  <text x="16" y="2410" font-weight="700">푸터 — 정보 · 정책 · 커뮤니티 링크 (1회만)</text>
  <text class="s" x="16" y="2432">목표 총 높이 ≈ 5,300–5,800px (현재 9,226px), 사례 첫 카드 ≤ 2화면</text>
</svg>
